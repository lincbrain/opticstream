name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --extra dev --frozen

      - name: Run unit tests
        run: uv run pytest -ra

  integration-tests:
    name: Prefect integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --extra dev --frozen

      - name: Start Prefect and PostgreSQL
        run: docker compose --profile server up -d

      - name: Wait for Prefect
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile server logs --no-color
          exit 1

      - name: Configure Prefect client
        run: uv run prefect config set PREFECT_API_URL=http://127.0.0.1:4200/api

      - name: Run integration tests
        run: uv run pytest -o addopts= -m integration -ra

      - name: Show service logs after a failure
        if: failure()
        run: docker compose --profile server logs --no-color

      - name: Stop services
        if: always()
        run: docker compose --profile server down
